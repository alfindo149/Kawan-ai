<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-label="Avatar GIA, perempuan muda dengan rambut panjang dan seragam futuristik ungu">
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c49"/><stop offset=".5" stop-color="#35206b"/><stop offset="1" stop-color="#071a38"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#bda2ff" stop-opacity=".8"/><stop offset="1" stop-color="#8664ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171326"/><stop offset=".3" stop-color="#39234c"/><stop offset=".62" stop-color="#101329"/><stop offset="1" stop-color="#7950a5"/></linearGradient>
 <linearGradient id="skin" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#ffe8dc"/><stop offset=".48" stop-color="#f2c4b2"/><stop offset="1" stop-color="#d99687"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ff"/><stop offset=".45" stop-color="#c9c8f5"/><stop offset="1" stop-color="#7565c9"/></linearGradient>
 <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251c51"/><stop offset="1" stop-color="#090f2b"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1c5ff"/><stop offset=".5" stop-color="#a16aff"/><stop offset="1" stop-color="#52cfff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
 </defs>
