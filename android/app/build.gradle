plugins {
    id 'com.android.application'
}
android {
    namespace 'id.gia.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'id.gia.assistant'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1.0-local-foundation'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
